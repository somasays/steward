[project]
name = "steward-agents"
version = "0.1.0"
description = "Agent runtime: owned contracts (tools, budgets, results). LangGraph is contained here (I9)."
requires-python = ">=3.12"
dependencies = [
    "steward-schemas",
    "steward-llm",
]

[tool.uv.sources]
steward-schemas = { workspace = true }
steward-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_agents"]
