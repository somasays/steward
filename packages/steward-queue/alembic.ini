# Alembic CLI entry point for authoring revisions:
#   cd packages/steward-queue && uv run alembic revision -m "..."
# Applying migrations goes through steward_queue.migrate.upgrade_to_head, which
# builds this same config programmatically and supplies the DSN — no URL is
# recorded here, so there is no environment-specific value to go stale.
[alembic]
script_location = src/steward_queue/migrations
file_template = rev_%%(rev)s_%%(slug)s
prepend_sys_path = src
