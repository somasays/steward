[project]
name = "steward-queue"
version = "0.1.0"
description = "Postgres task queue: transactional enqueue, SKIP LOCKED claiming, backoff retries, audit (I5/I7/I8/I12)."
requires-python = ">=3.12"
dependencies = [
    "steward-schemas",
    # The tracing seam (I7): the worker opens a task span per execution and the
    # queue derives every run's trace id. Langfuse itself stays contained there.
    "steward-telemetry",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # Imported directly by the Alembic env (it drives a SQLAlchemy engine), so it
    # is declared rather than leaned on as an alembic transitive. The queue's own
    # statements do not go through it -- see src/steward_queue/_sql.py.
    "sqlalchemy>=2.0",
]

[tool.uv.sources]
steward-schemas = { workspace = true }
steward-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_queue"]
