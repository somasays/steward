[project]
name = "steward-retrieval"
version = "0.1.0"
description = "Hybrid search client: Qdrant + ElasticSearch + fusion + rerank."
requires-python = ">=3.12"
dependencies = [
    "steward-schemas",
]

[tool.uv.sources]
steward-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_retrieval"]
