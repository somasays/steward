[project]
name = "steward-orchestration"
version = "0.1.0"
description = "Goal registry and deterministic planners: goal -> validated params -> task expansion (I3/I4/I12)."
requires-python = ">=3.12"
dependencies = [
    "steward-schemas",
]

[tool.uv.sources]
steward-schemas = { workspace = true }
steward-queue = { workspace = true }
steward-catalog = { workspace = true }

[dependency-groups]
dev = [
    # Test-only (never a runtime import, see the S1 contract): the allowlist
    # coherence test asserts every registered goal plans task types that some
    # handler in steward-queue's registry can actually execute. steward-catalog
    # is there because it is what registers `scan_source`'s handler -- without
    # importing it the coherence check would pass on an empty half of the seam.
    "steward-queue",
    "steward-catalog",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_orchestration"]
