[project]
name = "steward-schemas"
version = "0.1.0"
description = "Pydantic contracts shared across Steward: API, tool I/O, events. Pydantic + stdlib only (I4)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
steward-schemas-export-schemas = "steward_schemas.export_schemas:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_schemas"]
