[project]
name = "steward-llm"
version = "0.1.0"
description = "Thin gateway wrapper: typed completions via model aliases. Provider SDKs and litellm are contained here (I2)."
requires-python = ">=3.12"
dependencies = [
    "steward-schemas",
]

[tool.uv.sources]
steward-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_llm"]
