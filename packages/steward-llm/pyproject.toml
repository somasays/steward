[project]
name = "steward-llm"
version = "0.1.0"
description = "Thin gateway wrapper: typed completions via model aliases. Provider SDKs and litellm are contained here (I2)."
requires-python = ">=3.12"
dependencies = [
    "steward-schemas",
]

[tool.uv.sources]
steward-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_llm"]

# S1 containment home (I2/I9): unbans litellm + provider SDKs + langchain_core here only.
# Ruff config tables replace rather than merge across `extend`, so this restates the root
# banned-api dict minus this package's own contained modules -- keep in sync with root
# pyproject.toml.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"langchain_community" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"crewai" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"llama_index" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"autogen" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"semantic_kernel" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"pydantic_ai" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"haystack" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"langgraph" = { msg = "contained: steward-agents only (I2/I9)" }
"langfuse" = { msg = "contained: steward-telemetry only (I7/I9)" }
