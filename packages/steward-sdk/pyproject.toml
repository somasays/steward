[project]
name = "steward-sdk"
version = "0.1.0"
description = "Public Python client for the Steward REST API (generated types + hand-written ergonomics)."
requires-python = ">=3.12"
dependencies = [
    "steward-schemas",
]

[tool.uv.sources]
steward-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_sdk"]
