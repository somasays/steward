name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fitness:
    name: fitness gate (GUARDRAILS.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync project (once pyproject exists)
        run: |
          if [ -f pyproject.toml ]; then uv sync --all-packages; fi

      - name: Run fitness suite
        run: python3 scripts/fitness/run.py --stage ci

      - name: Fitness report (JSON artifact)
        if: always()
        run: python3 scripts/fitness/run.py --json > fitness-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitness-report
          path: fitness-report.json

  gitleaks:
    name: secret scan (G4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
