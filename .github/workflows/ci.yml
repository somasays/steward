name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fitness:
    name: fitness gate (GUARDRAILS.md)
    runs-on: ubuntu-latest
    steps:
      # Full history: S6 compares the exported contracts against the snapshot at the
      # baseline commit (PR base sha, or the merge-base with the default branch). At
      # depth 1 neither object is in the checkout and S6 FAILs "baseline unresolved".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync project (once pyproject exists)
        run: |
          if [ -f pyproject.toml ]; then uv sync --all-packages; fi

      - name: Run fitness suite
        run: python3 scripts/fitness/run.py --stage ci

      - name: Fitness report (JSON artifact)
        if: always()
        run: python3 scripts/fitness/run.py --json > fitness-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitness-report
          path: fitness-report.json

  gitleaks:
    name: secret scan (G4)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks action scans only the event's commit range, which errors out
      # on pull_request events ("stderr is not empty", 0 bytes scanned) and exits 1
      # on a scan that never happened. G4 promises full history on every event, so
      # invoke the CLI directly and scan the whole repo the same way every time.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --no-banner --redact --exit-code 1 .
