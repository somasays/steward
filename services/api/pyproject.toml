[project]
name = "steward-api"
version = "0.1.0"
description = "Steward API service (FastAPI gateway): runs API over the Postgres queue."
requires-python = ">=3.12"
dependencies = [
    "steward-schemas",
    "steward-orchestration",
    "steward-queue",
    # Importing it also registers the `scan_source` handler, which is what lets
    # the API validate that a planned task type is executable at all.
    "steward-catalog",
    "steward-telemetry",
    # The startup refusal (I15): every entry point this service ships validates the
    # gateway config before it does anything else, so a deployment whose routing table
    # reaches off the allowlist starts none of them (GUARDRAILS.md H12).
    "steward-llm",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
steward-api = "steward_api.__main__:main"
steward-api-export-openapi = "steward_api.export_openapi:main"

[tool.uv.sources]
steward-schemas = { workspace = true }
steward-orchestration = { workspace = true }
steward-catalog = { workspace = true }
steward-queue = { workspace = true }
steward-telemetry = { workspace = true }
steward-llm = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    # The H11 acceptance scenario drives the real app against a real Postgres
    # (GUARDRAILS.md Tier H): pgserver ships the server binaries, no Docker.
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_api"]
