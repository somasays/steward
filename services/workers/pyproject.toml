[project]
name = "steward-workers"
version = "0.1.0"
description = "Steward worker entrypoints: claim tasks from the Postgres queue and execute them."
requires-python = ">=3.12"
dependencies = [
    "steward-queue",
    "steward-telemetry",
    # A worker process can only execute the handlers registered in its own
    # process. Depending on the catalog -- and importing it in `__main__`
    # before the worker is built -- is what puts `scan_source` on the list of
    # task types this process claims.
    "steward-catalog",
    # First for refusing to start: the composition root validates the gateway config
    # before the worker claims anything, so a production alias pointed off the
    # allowlist never runs (I15), and H12 boots this entry point to prove it. The
    # client an M1 handler calls models with (issue #69) comes from the same package.
    "steward-llm",
    # The bounded runtime both agent handlers run on. Imported in `src/` since
    # #69 and undeclared until now: import-linter's contracts forbid edges, they
    # do not require declared ones, so this resolved on the workspace installing
    # every member and would have broken the day it did not. #50 adds a second
    # importer (`classifier.py`), which is what surfaced it.
    "steward-agents",
]

# Test-only, and written down because no tool can see it. #69's acceptance proof
# enters through `POST /v1/runs` -- the path the issue requires -- so this
# service's *test tree* imports the API service. import-linter's root packages
# are `src/` trees, so a tests/ import is outside every contract it enforces
# (the same blind spot #49 recorded twice), and uv's workspace would resolve it
# silently whether or not it were declared. Declared here so the edge is a
# stated dependency rather than an accident of one shared virtualenv; the
# `src/` trees stay independent, which the root import-linter contract enforces.
[dependency-groups]
dev = [
    "steward-api",
]

[project.scripts]
steward-worker = "steward_workers.__main__:main"

[tool.uv.sources]
steward-queue = { workspace = true }
steward-telemetry = { workspace = true }
steward-catalog = { workspace = true }
steward-llm = { workspace = true }
steward-agents = { workspace = true }
steward-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_workers"]
