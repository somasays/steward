[project]
name = "steward-workers"
version = "0.1.0"
description = "Steward worker entrypoints: claim tasks from the Postgres queue and execute them."
requires-python = ">=3.12"
dependencies = [
    "steward-queue",
    "steward-telemetry",
    # A worker process can only execute the handlers registered in its own
    # process. Depending on the catalog -- and importing it in `__main__`
    # before the worker is built -- is what puts `scan_source` on the list of
    # task types this process claims.
    "steward-catalog",
    # First for refusing to start: the composition root validates the gateway config
    # before the worker claims anything, so a production alias pointed off the
    # allowlist never runs (I15), and H12 boots this entry point to prove it. The
    # client an M1 handler calls models with (issue #69) comes from the same package.
    "steward-llm",
]

[project.scripts]
steward-worker = "steward_workers.__main__:main"

[tool.uv.sources]
steward-queue = { workspace = true }
steward-telemetry = { workspace = true }
steward-catalog = { workspace = true }
steward-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_workers"]
