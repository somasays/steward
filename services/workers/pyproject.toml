[project]
name = "steward-workers"
version = "0.1.0"
description = "Steward worker entrypoints: claim tasks from the Postgres queue and execute them."
requires-python = ">=3.12"
dependencies = [
    "steward-queue",
    "steward-telemetry",
]

[project.scripts]
steward-worker = "steward_workers.__main__:main"

[tool.uv.sources]
steward-queue = { workspace = true }
steward-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward_workers"]
