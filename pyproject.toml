[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "import-linter>=2.0",
    "types-PyYAML>=6.0",
    # Tier H harnesses run against a real Postgres, not a fake: pgserver ships the
    # server binaries in its wheel and starts an ephemeral instance per session, so
    # the queue's SKIP LOCKED and transaction semantics are exercised for real
    # without Docker on a developer laptop.
    "pgserver>=0.1.4",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages", "services"]
# Root docs are prose, not lint/format targets (ruff format touches embedded code fences).
extend-exclude = ["*.md"]

[tool.ruff.format]
# scripts/fitness stays hand-formatted (GUARDRAILS.md build-vs-buy rule); only linting
# (S608 below) applies to it, not reformatting.
exclude = ["scripts/fitness/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S608", "TID251"]

# B008 exists to catch a mutable or side-effecting value evaluated once at import and
# shared by every call. `fastapi.Depends` is neither: it is an inert marker FastAPI
# reads off the signature, and it is the only way to attach a dependency when a module
# uses `from __future__ import annotations` and the dependency is a closure -- the
# `Annotated` form resolves the annotation against module globals, where a closure
# variable does not exist, and silently degrades the parameter into a query field.
# Scoped to `Depends` alone so B008 keeps doing its real job everywhere else.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# scripts/fitness stays stdlib-only for Python 3.9+ (GUARDRAILS.md build-vs-buy rule) --
# style/upgrade rules don't apply there, but S608 (S3, SQL safety) still scans it,
# matching the bootstrap check it replaces.
"scripts/fitness/*.py" = ["E", "F", "I", "UP", "B"]

# S1 containment (I2, I9): kitchen-sink frameworks banned everywhere, contained modules
# (langgraph, litellm, langfuse, provider SDKs) banned by default and unbanned only inside
# their home package's own pyproject.toml, which extends this file and replaces this table
# (Ruff config tables don't merge across an `extend` chain -- the override must restate
# the full dict minus the modules that package owns). Keep the three package overrides
# (packages/steward-agents, packages/steward-llm, packages/steward-telemetry) in sync with
# this list.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"langchain_community" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"crewai" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"llama_index" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"autogen" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"semantic_kernel" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"pydantic_ai" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"haystack" = { msg = "kitchen-sink framework banned everywhere (I9)" }
"langgraph" = { msg = "contained: steward-agents only (I2/I9)" }
"langfuse" = { msg = "contained: steward-telemetry only (I7/I9)" }
"langchain_core" = { msg = "contained: steward-agents, steward-llm only (I2/I9)" }
"langchain_openai" = { msg = "contained: steward-llm only (I2/I9)" }
"litellm" = { msg = "contained: steward-llm only (I2/I9)" }
"openai" = { msg = "contained: steward-llm only (I2/I9)" }
"anthropic" = { msg = "contained: steward-llm only (I2/I9)" }
"google" = { msg = "contained: steward-llm only (I2/I9)" }
"mistralai" = { msg = "contained: steward-llm only (I2/I9)" }
"cohere" = { msg = "contained: steward-llm only (I2/I9)" }
"boto3" = { msg = "contained: steward-llm only (I2/I9)" }

# S1 boundaries (I4): one-way flow services -> packages, declared package edges,
# steward-schemas independence. Contract semantics: scripts/fitness/boundaries.json
# used to own this; it's now expressed natively here (see GUARDRAILS.md S1 row for the
# one-source-of-truth rationale) and boundaries.json is slimmed to contained_modules,
# which S5 (issue #6) consumes.
[tool.importlinter]
root_packages = [
    "steward_agents",
    "steward_catalog",
    "steward_llm",
    "steward_orchestration",
    "steward_queue",
    "steward_retrieval",
    "steward_schemas",
    "steward_sdk",
    "steward_telemetry",
    "steward_api",
    "steward_workers",
]

[[tool.importlinter.contracts]]
name = "services import packages, never the reverse (I4)"
type = "forbidden"
source_modules = ["steward_agents", "steward_catalog", "steward_llm", "steward_orchestration", "steward_queue", "steward_retrieval", "steward_schemas", "steward_sdk", "steward_telemetry"]
forbidden_modules = ["steward_api", "steward_workers"]

# Services are siblings, not layers: ARCHITECTURE.md's flow is `services ->
# packages`, and one service reaching into another's internals is not a
# direction the architecture contemplates. The API and the worker share
# everything they legitimately share through `packages/`. Their *test* trees are
# a different matter and outside import-linter's reach entirely -- #69's
# acceptance proof enters through the API on purpose -- so that edge is declared
# by hand in `services/workers/pyproject.toml` instead.
[[tool.importlinter.contracts]]
name = "services do not import each other (I4)"
type = "forbidden"
source_modules = ["steward_api"]
forbidden_modules = ["steward_workers"]

[[tool.importlinter.contracts]]
name = "the worker does not import the API service (I4)"
type = "forbidden"
source_modules = ["steward_workers"]
forbidden_modules = ["steward_api"]

[[tool.importlinter.contracts]]
name = "steward-agents depends only on its declared edges (I4)"
type = "forbidden"
source_modules = ["steward_agents"]
forbidden_modules = ["steward_catalog", "steward_orchestration", "steward_queue", "steward_retrieval", "steward_sdk"]

# steward-queue's one package edge beyond schemas: steward-telemetry. The worker
# opens a task span per execution and every run gets a trace id, so the queue
# depends on the tracing *contract* — never on Langfuse, which S1's banned-api
# table keeps inside steward-telemetry.
[[tool.importlinter.contracts]]
name = "steward-queue depends only on steward-schemas and steward-telemetry (I4)"
type = "forbidden"
source_modules = ["steward_queue"]
forbidden_modules = ["steward_agents", "steward_catalog", "steward_llm", "steward_orchestration", "steward_retrieval", "steward_sdk"]

# steward-catalog sits one layer above the queue: it writes the catalog through
# the queue's connection type and the queue's audit writer (I1, I7), and reads
# customer databases through its own connector. It must not learn about goals
# (a planner names its task type; the handler does not know who planned it) or
# about the agent runtime.
[[tool.importlinter.contracts]]
name = "steward-catalog depends only on steward-schemas and steward-queue (I4)"
type = "forbidden"
source_modules = ["steward_catalog"]
# steward_telemetry is absent from this list because these contracts are
# transitive: steward-queue depends on it (the worker's task span), so every
# importer of the queue reaches it and forbidding it here would be unenforceable
# theatre. The package's `src/` imports it nowhere; its *test* tree does, to
# build the recording tracer H7 asserts span payloads with, and that edge is
# declared in the package's own dev group -- import-linter cannot see test
# trees, so a dependency that lives only there has to be written down by hand
# (#49 review).
forbidden_modules = ["steward_agents", "steward_llm", "steward_orchestration", "steward_retrieval", "steward_sdk"]

# steward-orchestration is a leaf below: the goal registry knows task *type
# names* and nothing about how tasks are stored or executed, and the queue --
# which dispatches task types -- must never learn which goals exist (issue #19).
# The forbidden edge above and this package's membership below are the two
# halves of that statement.
[[tool.importlinter.contracts]]
name = "leaf packages depend only on steward-schemas (I4)"
type = "forbidden"
source_modules = ["steward_llm", "steward_orchestration", "steward_retrieval", "steward_sdk", "steward_telemetry"]
forbidden_modules = ["steward_agents", "steward_catalog", "steward_llm", "steward_orchestration", "steward_queue", "steward_retrieval", "steward_sdk", "steward_telemetry"]

[[tool.importlinter.contracts]]
name = "steward-schemas is independent: pydantic + stdlib only (I4)"
type = "forbidden"
source_modules = ["steward_schemas"]
forbidden_modules = ["steward_agents", "steward_catalog", "steward_llm", "steward_orchestration", "steward_queue", "steward_retrieval", "steward_sdk", "steward_telemetry"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
    "packages/steward-schemas/src",
    "packages/steward-agents/src",
    "packages/steward-catalog/src",
    "packages/steward-llm/src",
    "packages/steward-orchestration/src",
    "packages/steward-queue/src",
    "packages/steward-retrieval/src",
    "packages/steward-sdk/src",
    "packages/steward-telemetry/src",
    "services/api/src",
    "services/workers/src",
]
# Per-member tests share basenames across siblings (e.g. test_smoke.py in packages,
# conftest.py in packages and services); they're exercised by pytest (H3), not strict
# typing. mypy_path lists each member's src/ explicitly (packages and services alike)
# so sibling modules with identical relative paths resolve to distinct dotted names
# instead of colliding under implicit namespace packages (issue #17).
exclude = "(^|/)tests/"

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
markers = [
    "invariants: generic harnesses that hold for every registered component (I7, I8, I12)",
    "acceptance: functional acceptance scenarios against milestone exit criteria (SPEC.md §12)",
    # The one test that calls a real model over the real route (#50). Skips loudly
    # without a gateway and *fails* under STEWARD_EVALS_REQUIRED=1, so it is
    # harmless in the ordinary credential-free suite and mandatory in the release
    # job. Not `acceptance`: H11 runs on every commit and must never need a model.
    "live_gateway: the live LiteLLM -> vLLM smoke test (issue #50 amendment)",
]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["packages"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
