[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages", "services"]
# scripts/fitness predates this config and is off-limits to edit for this issue;
# it stays stdlib-only by its own design (GUARDRAILS.md), not lint-gated here.
# Root docs are prose, not lint/format targets (ruff format touches embedded code fences).
extend-exclude = ["scripts/fitness", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
    "packages/steward-schemas/src",
    "packages/steward-agents/src",
    "packages/steward-llm/src",
    "packages/steward-retrieval/src",
    "packages/steward-sdk/src",
]
# Per-package tests share the basename test_smoke.py across sibling packages;
# they're exercised by pytest (H3), not by strict typing.
exclude = "(^|/)tests/"

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
markers = [
    "invariants: generic harnesses that hold for every registered component (I7, I8, I12)",
    "acceptance: functional acceptance scenarios against milestone exit criteria (SPEC.md §12)",
]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["packages"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
