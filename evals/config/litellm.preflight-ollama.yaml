      seed: 20260814
    model_info:
      input_cost_per_token: 0.00000002
      output_cost_per_token: 0.00000006
      chat_template_tokens_per_message: 8
  - model_name: steward-embed
    litellm_params:
      model: openai/nomic-embed-text
